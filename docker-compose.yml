services:
  neo4j:
    image: neo4j:2026.10.1
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/hotel-local
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p hotel-local 'RETURN 1' >/dev/null",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 25s

  load:
    image: neo4j:2026.10.1
    volumes:
      - neo4j_data:/data
      - ./data:/backups:ro
    entrypoint: ["neo4j-admin"]
    command:
      - database
      - load
      - neo4j
      - --from-path=/backups
      - --overwrite-destination=true

volumes:
  neo4j_data:
